<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        💰 Monthly Budget Planner
    </h2>

    <!-- Budget Form -->
    <div class="card shadow mb-4">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Monthly Budget (₹)</label>

                    <input
                        type="number"
                        class="form-control"
                        name="monthly_budget"
                        value="{{ budget }}"
                        required>

                </div>

                <button class="btn btn-success w-100">
                    Save Budget
                </button>

            </form>

        </div>
    </div>

    <!-- Budget Cards -->
    <div class="row">

        <div class="col-md-4 mb-3">
            <div class="card border-success shadow">
                <div class="card-body text-center">

                    <h5>Budget</h5>
                    <h2 class="text-success">
                        ₹{{ budget }}
                    </h2>

                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card border-danger shadow">
                <div class="card-body text-center">

                    <h5>Spent</h5>
                    <h2 class="text-danger">
                        ₹{{ total_expense }}
                    </h2>

                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card border-primary shadow">
                <div class="card-body text-center">

                    <h5>Remaining</h5>
                    <h2 class="text-primary">
                        ₹{{ remaining }}
                    </h2>

                </div>
            </div>
        </div>

    </div>

    <!-- Progress Bar -->
    <div class="card shadow mt-4">

        <div class="card-body">

            <h5 class="mb-3">
                Budget Usage
            </h5>

            <div class="progress" style="height:30px;">

                <div
                    id="budgetBar"
                    class="progress-bar"
                    role="progressbar">
                </div>

            </div>

        </div>

    </div>

    <!-- Monthly Chart -->
    <div class="card shadow mt-4">

        <div class="card-body">

            <h4 class="text-center mb-4">
                📈 Monthly Income vs Expense
            </h4>

            <canvas id="monthlyChart"></canvas>

        </div>

    </div>

    <!-- Back Button -->
    <div class="text-center mt-4 mb-5">

        <a href="/dashboard" class="btn btn-primary">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>

//
// Budget Progress Bar
//
const percentage = parseFloat("{{ percentage }}");

const bar = document.getElementById("budgetBar");

bar.style.width = percentage + "%";
bar.innerHTML = percentage.toFixed(1) + "%";

if (percentage < 60) {

    bar.classList.add("bg-success");

}
else if (percentage < 85) {

    bar.classList.add("bg-warning");

}
else {

    bar.classList.add("bg-danger");

}

//
// Monthly Income vs Expense Chart
//
const months = JSON.parse('{{ months|tojson }}');
const monthlyIncome = JSON.parse('{{ monthly_income|tojson }}');
const monthlyExpense = JSON.parse('{{ monthly_expense|tojson }}');

const ctx = document.getElementById("monthlyChart");

new Chart(ctx, {

    type: "line",

    data: {

        labels: months,

        datasets: [

            {

                label: "Income",

                data: monthlyIncome,

                borderColor: "green",

                backgroundColor: "rgba(0,128,0,0.15)",

                fill: false,

                tension: 0.3

            },

            {

                label: "Expense",

                data: monthlyExpense,

                borderColor: "red",

                backgroundColor: "rgba(255,0,0,0.15)",

                fill: false,

                tension: 0.3

            }

        ]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {

                position: "bottom"

            }

        }

    }

});

</script>

</body>
</html>
